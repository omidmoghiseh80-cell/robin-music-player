<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robin Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player {
      width: 90%;
      max-width: 500px;
      background: #1c1c1c;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .song-name {
      margin: 25px 0 15px;
      font-size: 18px;
      color: #ddd;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="player">
    <h1>Robin Music Player</h1>

    <div class="song-name">
      Full Fund Pro
    </div>

    <audio controls preload="metadata">
      <source
        src="https://github.com/omidmoghiseh80-cell/robin-music-player/releases/download/music-v1/Full-Fund-Pro.mp3"
        type="audio/mpeg"
      />
      مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
    </audio>
  </div>

</body>
</html>
