<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="Arad Music Playlists - پخش آنلاین موزیک از GitHub Releases" />
  <title>Arad Music Playlists</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <strong>Arad Music</strong>
          <span>Playlists</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="all"><span>♫</span> همه آهنگ‌ها</button>
        <button class="nav-item" data-view="favorites"><span>♥</span> موردعلاقه‌ها</button>
        <button class="nav-item" data-view="recent"><span>◷</span> اخیراً پخش‌شده</button>
      </nav>

      <div class="sidebar-section">
        <div class="section-title">پلی‌لیست‌ها</div>
        <div id="playlistList" class="playlist-list"></div>
        <button class="ghost-btn" id="newPlaylistBtn">＋ پلی‌لیست جدید</button>
      </div>

      <div class="sidebar-footer">
        <button class="icon-text-btn" id="themeBtn">◐ تغییر تم</button>
        <div class="small-muted">GitHub Release: <b>music-v1</b></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn">☰</button>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="جستجو بین آهنگ‌ها..." autocomplete="off" />
          <kbd>/</kbd>
        </div>
        <div class="top-actions">
          <button class="pill-btn" id="shuffleAllBtn">⤨ Shuffle</button>
          <button class="icon-btn" id="refreshBtn" title="بروزرسانی لیست">↻</button>
        </div>
      </header>

      <section class="hero">
        <div>
          <div class="eyebrow">ARAD MUSIC PLAYLISTS</div>
          <h1 id="pageTitle">همه آهنگ‌ها</h1>
          <p id="heroSub">کتابخانه موسیقی آنلاین شما</p>
          <div class="hero-actions">
            <button class="primary-btn" id="playAllBtn">▶ پخش همه</button>
            <button class="secondary-btn" id="randomBtn">✦ یک آهنگ تصادفی</button>
          </div>
        </div>
        <div class="hero-stat">
          <div class="stat-number" id="trackCount">0</div>
          <div class="stat-label">آهنگ</div>
        </div>
      </section>

      <section class="toolbar">
        <div class="filters">
          <button class="filter active" data-sort="default">پیش‌فرض</button>
          <button class="filter" data-sort="az">A–Z</button>
          <button class="filter" data-sort="za">Z–A</button>
        </div>
        <div class="small-muted" id="statusText">در حال دریافت لیست آهنگ‌ها…</div>
      </section>

      <section class="track-table">
        <div class="track-head">
          <div>#</div>
          <div>عنوان</div>
          <div class="desktop-only">فایل</div>
          <div class="desktop-only">مدت</div>
          <div></div>
        </div>
        <div id="trackList" class="track-list"></div>
      </section>

      <div id="emptyState" class="empty hidden">
        <div class="empty-icon">♫</div>
        <h3>چیزی پیدا نشد</h3>
        <p>عبارت جستجو یا فیلتر را تغییر بده.</p>
      </div>
    </main>
  </div>

  <div class="player-bar" id="playerBar">
    <div class="now-playing">
      <div class="cover-mini" id="coverMini">♫</div>
      <div class="now-meta">
        <strong id="nowTitle">آهنگی انتخاب نشده</strong>
        <span id="nowFile">—</span>
      </div>
      <button class="heart-btn" id="favCurrentBtn" title="علاقه‌مندی">♡</button>
    </div>

    <div class="player-center">
      <div class="controls">
        <button id="shuffleBtn" class="player-icon" title="Shuffle">⤨</button>
        <button id="prevBtn" class="player-icon">⏮</button>
        <button id="playBtn" class="play-main">▶</button>
        <button id="nextBtn" class="player-icon">⏭</button>
        <button id="repeatBtn" class="player-icon" title="Repeat">↻</button>
      </div>
      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" />
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="player-extra">
      <button class="player-icon" id="sleepBtn" title="Sleep timer">☾</button>
      <select id="speedSelect" class="speed-select" title="سرعت پخش">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button class="player-icon" id="muteBtn">🔊</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" />
    </div>
  </div>

  <div class="mobile-player hidden" id="mobilePlayer">
    <div class="mobile-player-top">
      <div class="mobile-cover">♫</div>
      <div class="mobile-meta">
        <strong id="mobileTitle">—</strong>
        <span id="mobileFile">—</span>
      </div>
      <button id="mobileCloseBtn" class="icon-btn">⌄</button>
    </div>
    <div class="mobile-progress"><div id="mobileProgressFill"></div></div>
    <div class="mobile-big-controls">
      <button id="mobileShuffleBtn">⤨</button>
      <button id="mobilePrevBtn">⏮</button>
      <button id="mobilePlayBtn" class="big-play">▶</button>
      <button id="mobileNextBtn">⏭</button>
      <button id="mobileRepeatBtn">↻</button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <div class="toast" id="toast"></div>

  <dialog id="playlistDialog">
    <form method="dialog" class="dialog-card" id="playlistForm">
      <h3>پلی‌لیست جدید</h3>
      <input id="playlistName" placeholder="مثلاً آهنگ‌های شب" maxlength="40" />
      <div class="dialog-actions">
        <button value="cancel" class="secondary-btn">انصراف</button>
        <button value="default" class="primary-btn" id="createPlaylistConfirm">ساخت</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
